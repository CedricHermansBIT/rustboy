name: Emulator checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      RUSTBOY_BROWSER: google-chrome
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install matching Rust and WASM tools
        run: |
          curl --fail --location --retry 3 \
            https://github.com/WebAssembly/binaryen/releases/download/version_117/binaryen-version_117-x86_64-linux.tar.gz \
            --output "$RUNNER_TEMP/binaryen.tar.gz"
          echo "3dc677006555b355ea2da5e82602065a161d5e83eaefd3f759afa00b96e83212  $RUNNER_TEMP/binaryen.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_117/bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --locked --version 0.2.118
      - name: Native and JavaScript regressions
        run: python3 scripts/check.py --gba-jit
      - name: Independent GBA compatibility baseline
        run: python3 scripts/check_gba_compatibility.py --fetch --baseline
      - name: Regenerated ROM registry stays in sync
        run: |
          python3 generate_tests.py
          git diff --exit-code -- tests/headless.rs
      - name: Build without local boot ROMs or game files
        run: python3 scripts/build_web.py
      - name: Real-browser initialization and hardware smoke tests
        run: |
          node tests/browser_smoke.mjs
          RUSTBOY_NO_BOOT=1 node tests/browser_smoke.mjs
          RUSTBOY_NO_BOOT=1 RUSTBOY_SYNTHETIC_CGB=1 node tests/browser_smoke.mjs
          RUSTBOY_GBA_UPLOAD=1 RUSTBOY_GBA_JIT_VERIFY=1 node tests/browser_smoke.mjs
          node tests/gba_link_browser.mjs
          node tests/gba_link_firefox.mjs
          RUSTBOY_GBA_SAVE_FAILURES=1 node tests/browser_smoke.mjs
      # Licensed/local ROM and boot-ROM suites are a separate release gate:
      # python3 scripts/check.py --roms --browser
  windows-firefox-link:
    runs-on: windows-2025
    timeout-minutes: 5
    env:
      RUSTBOY_FIREFOX: 'C:\Program Files\Mozilla Firefox\firefox.exe'
      RUSTBOY_LOCAL_ICE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Firefox direct pairing with address privacy and delayed codes
        run: node tests/gba_link_firefox.mjs
      - name: Firefox direct pairing with a longer manual exchange
        env:
          RUSTBOY_ANSWER_DELAY_MS: '45000'
        run: node tests/gba_link_firefox.mjs
